appId: dev.marekhanzal.arkini
productName: Arkini
asar: true
asarUnpack:
  - node_modules/@img/**/*
  - node_modules/@ngrok/ngrok-darwin-arm64/**/*.node
  - node_modules/@ngrok/ngrok-linux-arm64-gnu/**/*.node
  - node_modules/@ngrok/ngrok-linux-x64-gnu/**/*.node
  - node_modules/@ngrok/ngrok-win32-x64-msvc/**/*.node
  - node_modules/sharp/**/*
npmRebuild: true
beforeBuild: ./electron/builder/beforeBuild.mjs
electronLanguages:
  - cs-CZ
  - en-US
  - en-GB
  - en_GB
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
extraMetadata:
  main: app/main/index.js
directories:
  output: .out/desktop/release
  buildResources: electron/resources
files:
  - '!node_modules/**/*'
  - package.json
  - from: node_modules/@ngrok
    to: node_modules/@ngrok
    filter:
      - ngrok/**/*
      - ngrok-darwin-arm64/**/*
      - ngrok-linux-arm64-gnu/**/*
      - ngrok-linux-x64-gnu/**/*
      - ngrok-win32-x64-msvc/**/*
  - from: node_modules/@img
    to: node_modules/@img
    filter:
      - '**/*'
  - from: node_modules/detect-libc
    to: node_modules/detect-libc
    filter:
      - '**/*'
  - from: node_modules/sharp
    to: node_modules/sharp
    filter:
      - '**/*'
  - from: node_modules/sharp/node_modules/semver
    to: node_modules/sharp/node_modules/semver
    filter:
      - '**/*'
  - from: .out/desktop/build
    to: app
    filter:
      - '**/*'
extraResources:
  - from: game/arkini/build
    to: game
    filter:
      - arkini.arkpack
mac:
  category: public.app-category.games
  icon: icon.png
  identity: null
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  extraFiles:
    - from: electron/resources/arkini-cli
      to: MacOS/arkini-cli
dmg:
  title: ${productName} ${version}
win:
  icon: icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
linux:
  category: Game
  icon: icon.png
  target: AppImage
