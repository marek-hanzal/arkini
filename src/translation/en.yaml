Authored Clock expiry output summary help:
  value: |
    Runs once when **Lifetime** reaches zero.

    It uses the same sets, rolls, drops and placement rules as any other output.
Authored Clock interval summary help:
  value: |
    How often the Clock tries its selected production line.

    **None** means no repeating production. Lifetime can still expire.
Authored Clock kill-switch summary help:
  value: |
    **Stop immediately** removes the item at the end of its Lifetime, even if a job is unfinished or output has nowhere to go.
Authored Clock lifetime summary help:
  value: |
    How long the item may stay on a Board before it expires.

    **Unlimited** means it never expires on its own.
Authored Clock loose-kill summary help:
  value: |
    **Wait for output** lets started jobs finish before the expired item disappears. If output has nowhere to go, the item waits too.
Authored Clock rules summary help:
  value: |
    These rules pause or resume the Clock.

    Every **Enable** rule must pass. Any matching **Disable** rule pauses it.
Authored Clock status summary help:
  value: |
    The Clock's starting state.

    Rules can still enable or disable it during play.
Authored Clock summary help:
  value: |
    Clock gives the item time-based behavior:

    - **Interval** repeatedly tries the selected production line.
    - **Lifetime** expires the item and may create an output.

    Lifetime also works without production.
Authored Units amount summary help:
  value: |
    Units stored inside each new item.

    A stack may hold several items, and each item keeps this amount separately.
Authored Units depletion output summary help:
  value: |
    Runs when an item's Units reach zero.

    Leave it empty to remove the depleted item without creating anything.
Authored Units summary help:
  value: |
    Units are a spendable supply inside each item.

    A stack of several items has several separate Unit supplies.
Authored action rules summary help:
  value: |
    These rules run before the action pays its costs.

    Every **Enable** rule must pass. Any matching **Disable** rule blocks the action.
Authored action summary help:
  value: |
    Runs when the player uses this item.

    It checks **Rules**, pays every **Requirement**, then opens Inventory or enters the chosen Space.
Authored artwork summary help:
  value: |
    Combines a base image and optional overlay at one shared scale.

    Artwork changes only appearance, never placement or gameplay.
Authored drop rules summary help:
  value: |
    These rules apply only to this drop.

    A blocked drop does not cancel the other drops in the same roll.
Authored merge output summary help:
  value: |
    Extra output created after both sides of the merge are updated.

    Leave it empty when the merge should only change its two items.
Authored merge source action summary help:
  value: |
    What happens to the item you drag:

    - **Use:** keep it.
    - **Consume:** remove one item.
    - **Spend:** remove one Unit.
Authored merge target effect summary help:
  value: |
    What happens to the item receiving the drop:

    - **Keep:** leave it.
    - **Remove:** remove one item.
    - **Replace:** swap one item.
    - **Spend:** remove one Unit.
Authored merge target summary help:
  value: |
    The item you drop this item **onto**.

    Direction matters: A onto B is different from B onto A.
Authored merges summary help:
  value: |
    Starts when you drop this item onto its selected target.

    It updates the dragged item, updates the target, then creates any extra output.
Authored output summary help:
  value: |
    One output set is picked by weight, then every roll inside it runs.

    A roll can be **Guaranteed**, use one **Chance**, or make **Weighted** picks.
Authored player controls summary help:
  value: |
    **Interactive** lets players run production and manage its inputs, queue and selected lines.

    **Automatic only** leaves production to the game.
Authored production Check ahead marker help:
  value: |
    Before creating this item, checks whether one next run could stay within item limits.

    Nothing is reserved. One fitting line is enough.
Authored production Clock marker help:
  value: |
    The line attempted on every Clock interval.
Authored production Default marker help:
  value: |
    The line initially selected for manual production.
Authored production Enabled marker help:
  value: |
    Whether this line starts enabled.

    Enable and Disable rules may change that during play.
Authored production Visible marker help:
  value: |
    Whether players see this line at the start.

    Show and Hide rules may change that during play.
Authored production inputs summary help:
  value: |
    Every requirement must be ready before the line starts.

    - **Consumed materials** disappear.
    - **Reserved materials** return afterward.
    - **Self Units** come from this item.
    - **Target Units** come from a matching Board item.
Authored production line output summary help:
  value: |
    Optional items created when the line finishes.

    The output may choose between sets, run several rolls and apply rules to each drop.
Authored production output summary help:
  value: |
    Runs when this production line finishes.

    One set is picked by weight, then every roll inside that set runs independently.
Authored production rules summary help:
  value: |
    Rules control whether players see the line, whether it can start, and how long it takes.

    Every **Enable** must pass. **Hide** and **Disable** win when they match.
Authored production runtime summary help:
  value: |
    How long one run normally takes.

    Matching time rules may add, subtract or multiply this value.
Authored production summary help:
  value: |
    Production is enabled when the item has at least one line.

    Each line has its own time, requirements, rules and output. All lines share one queue.
Authored queue capacity summary help:
  value: |
    Maximum work accepted across all lines on this item.

    The active job counts too.
