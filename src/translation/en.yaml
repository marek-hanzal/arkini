Flow:
  value: Flow
Flow help:
  value: |
    Flow is the project's **connection map**. It lets you follow an item in both directions without opening every production line and rule one by one.

    Use it to answer two practical questions:

    - Choose **Input** when you are asking, “Where can this item go?” Flow highlights operations that use the selected item and the items those operations can produce.
    - Choose **Output** when you are asking, “Where can this item come from?” Flow highlights operations that produce the selected item and the items those operations need.

    ### Using the graph

    - Search for an item to focus its chain.
    - Click an item card to select it and highlight its connections. Click the item name inside the card to open its full detail.
    - Click a connection dot on the edge of a card to jump to the item at the other end.
    - Drag the canvas to move around. The surrounding project stays visible as context.

    Flow shows authored possibilities, not what will happen in one playthrough. It does not simulate placement, timing, rule truth or actual random rolls.

    Press `?` to open the keyboard help inside the graph. It lists shortcuts for moving through items, showing more or less of a chain, returning to your selection and retracing recently visited items.
Game limit:
  value: Game limit
Global estimate help:
  value: |
    Global Estimate gives you two quick signals for every item: **how soon could a player obtain it, and how much does the rest of the economy rely on it?**

    It reads the authored starting items and production rules and picks one complete route to each item. This is a planning preview, not a playthrough or a balance verdict.

    ### Reading the list

    - **Estimate** is the optimistic time to obtain one item. Independent work can happen in parallel, and random outputs are averaged across the expected number of attempts.
    - **Demand** adds up how much of this item is needed to obtain one of every reachable item through the selected routes. The percentage compares it with the highest-demand item in this project, not with the total.
    - **Partial** means the analysis hit a safety limit. **No path** means the authored data contains no complete route from the starting items.

    Use **Fastest first** and **Slowest first** to find pacing outliers, **Highest demand first** to spot heavily reused ingredients or prerequisites, and **Incomplete only** to find broken or unusually complex paths.

    Open an item to see its selected route and the quantities and time behind the estimate.
