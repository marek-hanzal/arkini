Editor Board help:
  value: |
    Editor Board runs the **saved project** as a real game. Use it to try production, merges, Units and placement together. Nothing you do here edits the project.

    - `Cmd+P` (`Ctrl+P` on Windows and Linux) finds and spawns Board items.
