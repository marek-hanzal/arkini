Rolls:
  value: Rolls
Rolls help:
  value: |
    Every roll in the chosen output set runs independently.

    - **Guaranteed:** always creates all its drops.
    - **Chance:** makes one probability check for all its drops.
    - **Weighted:** makes the number of picks under **Selections**; every pick chooses one candidate by weight.

    Example: two picks between **3 Iron, weight 3** and **1 Coal, weight 1** give each pick a 75% Iron / 25% Coal chance. The result can be **6 Iron**, **3 Iron + 1 Coal**, or **2 Coal**.
