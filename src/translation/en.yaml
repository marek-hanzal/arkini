Asset delete help:
  value: |
    Delete an unused asset from the project. Saved item or project references block deletion; open **Usage** and remove or replace those references first.

    Deleting an asset removes its note links while preserving the notes themselves. The confirmation applies to this saved resource.
Asset editing help:
  value: |
    Rename this asset or replace its PNG image. **Save** validates and writes both changes together; **Discard** abandons this draft and returns to the saved asset.

    Renaming updates saved item, project and note references. Replacing the image changes every use of this asset. The source remains unchanged until Save succeeds.
Asset image replacement help:
  value: |
    Drop a **PNG** onto the preview or click it to choose a file. The replacement affects every use of this asset after **Save**. Leaving it unchanged preserves the current image.
Asset missing description:
