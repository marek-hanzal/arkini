    Inspect the source image, dimensions, MIME type, file size and package status before using this project asset in artwork. **Create item** starts a new item draft using this asset. **Edit** lets you rename the asset or replace its PNG image.

    The asset is shared: replacing its image changes every saved reference. **Usage** lists those references; **Notes** keeps linked authoring notes.
Asset usage help:
