name: Repository Checks

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Full repository gate (Linux)
            os: ubuntu-24.04
            command: check
          - name: Platform boundary gate (macOS)
            os: macos-15
            command: platform-check
          - name: Platform boundary gate (Windows)
            os: windows-2025
            command: platform-check
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install dependencies
        run: ./Argcfile.sh install

      - name: Run repository gate
        run: ./Argcfile.sh "${{ matrix.command }}"
