Templates help:
  value: |
    **Templates are prepared board spaces for gameplay.** Each template describes a complete board: its width, height, and the items placed in its cells.

    Use **General** to name the template and set its width and height, and **Board** to arrange its contents. Click an empty cell to add an item, drag an item to move it, or right-click it to remove it.

    Each template has a stable **UID**. Changing its title or contents keeps that identity. Templates have their own dimensions; the project board size only supplies the initial dimensions when creating one.

    A template has no Space number. The same layout can be used for different spaces. Templates are included in the Serapack. A new game creates independent items for each assigned Space. Saved games keep their existing items. Board dimensions always come from the loaded Serapack’s assigned template, or the project defaults for unassigned spaces.
