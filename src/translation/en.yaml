Action disable rule help:
  value: |
    A **Disable** rule vetoes the action while all of its conditions match.

    Disable wins over the authored state and every passing Enable rule. It affects activation only; it does not remove the action or change its inputs.
Action enable rule help:
  value: |
    An **Enable** rule is a positive gate for the action. When Enable rules exist, **every** one must pass before activation is available.

    A matching Disable rule still wins.
Action input type help:
  value: |
    Action inputs are settled when the player activates the item.

    - **Simple** adds no external requirement.
    - **Units** spends units from this item or a matching item on the current Board.
Action inputs:
  value: Action inputs
Action inputs help:
  value: |
    These requirements are checked and settled **when the action activates**.

    Every configured input must be satisfiable. **Simple** documents that no external item is needed; **Units** spends from the owner or a matching Board item. Actions do not accept delivered material inputs.
Action rules help:
  value: |
    These rules control whether the item action may activate.

    Every **Enable** rule must pass. Any matching **Disable** rule vetoes activation. The action's inputs are settled only after the rules accept it.
