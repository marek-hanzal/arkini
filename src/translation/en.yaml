Chain help:
  value: |
    Chain previews what can follow from this item's merges and Clock.

    - **Merge direction matters.** A onto B is different from B onto A.
    - After the first step, Chain follows Clock production and expiry. It stops following new Merges and input items.
    - Periodic production is shown once for one attempt, not as an endless pile of rewards.
    - **Details** explains each step. Set weights, chances, conditions and quantities stay visible.
    - Chain follows up to **five steps**. Reaching a loop or step five means more may follow.

    This is a map of possible results, not a playthrough. Rules, missing inputs, full queues or blocked placement may still prevent them.
Chain pulse explanation:
  value: Shows one possible production run. The item stays until Lifetime ends. Missing inputs, rules, a full queue or blocked output can still stop it.
