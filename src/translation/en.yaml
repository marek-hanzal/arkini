Authored Clock expiry output summary help:
  value: |
    Runs when the item's **Lifetime** expires.

    Its output uses the same independent output sets, rolls, weighted candidates, placement, and drop rules as production output.
Authored Clock interval summary help:
  value: |
    The delay between automatic Clock attempts.

    **None** means the Clock has no repeating interval. A configured **Lifetime** can still expire.
Authored Clock kill-switch summary help:
  value: |
    **Kill switch** removes the item as soon as its Lifetime expires, even when the expiry output cannot be placed.
Authored Clock lifetime summary help:
  value: |
    How long the item may remain on a Board before expiring.

    **Unlimited** means the item has no authored lifetime.
Authored Clock loose-kill summary help:
  value: |
    **Loose-kill** waits until the expiry output can resolve. The item remains present while that output is blocked.
Authored Clock rules summary help:
  value: |
    These rules control whether the Clock may advance.

    Every **Enable** rule must pass. Any matching **Disable** rule pauses the Clock.
Authored Clock status summary help:
  value: |
    The authored starting state of the timer.

    Rules may still enable or disable the Clock while the game is running.
Authored Clock summary help:
  value: |
    Clock gives the item time-based behavior:

    - **Interval** attempts the marked production line repeatedly.
    - **Lifetime** expires the item and may resolve an expiry output.

    A Lifetime works even when the item has no production lines.
Authored Units amount summary help:
  value: |
    Units are supply stored **inside each item**.

    This is the amount assigned when one item enters the game; it is independent of the number of items in the stack.
Authored Units depletion output summary help:
  value: |
    Resolves when the item's Units reach zero.

    Leaving this empty removes the depleted item without producing anything.
Authored Units summary help:
  value: |
    Units are consumable supply stored inside each item.

    **Item count** and **Units** are separate: a stack can contain several items, and every item keeps its own Units.
Authored action rules summary help:
  value: |
    These rules gate the action before its requirements are settled.

    Every **Enable** rule must pass. Any matching **Disable** rule vetoes activation.
Authored action summary help:
  value: |
    An action runs when the player activates the item.

    It first checks its **Rules**, then settles every **Requirement**, and finally opens Inventory or enters the configured space.
Authored artwork summary help:
  value: |
    The base asset and optional overlay share one tile scale.

    Artwork changes the rendered composition only. It does **not** change placement, occupied cells, or gameplay behavior.
Authored drop rules summary help:
  value: |
    These rules decide whether this individual drop is available.

    A rejected drop does not cancel its sibling drops in the same roll.
Authored merge output summary help:
  value: |
    Extra output resolves after the merge's source action and target effect succeed.

    Leaving it empty means the merge changes only its source and target items.
Authored merge source action summary help:
  value: |
    Controls what happens to the item being dragged:

    - **Use** keeps it.
    - **Consume** removes one item.
    - **Spend** removes one Unit from it.
Authored merge target effect summary help:
  value: |
    Controls what happens to the item receiving the drop:

    - **Keep** leaves it unchanged.
    - **Remove** deletes one item.
    - **Replace** swaps it for the selected replacement.
    - **Spend** removes one Unit from it.
Authored merge target summary help:
  value: |
    The item that accepts this source item as a merge.

    Merge direction matters: this item is dragged **onto** the selected target.
Authored merges summary help:
  value: |
    A merge starts when this item is dropped onto a matching target.

    The merge applies its **Source action**, then its **Target effect**, and finally resolves any extra output.
Authored output summary help:
  value: |
    Output is resolved as a set of alternatives.

    Each output set has a relative weight and contains independent rolls. A roll may be **Guaranteed**, test one **Chance**, or make one or more **Weighted** selections.
Authored player controls summary help:
  value: |
    Controls which player-facing operations are available.

    **Interactive** permits manual production, material management, queue changes, and line selection. **Automatic only** leaves those decisions to game systems.
Authored production Check ahead marker help:
  value: |
    Before this item is produced, checks one future run from each marked, shown, and enabled line against item count limits.

    The check reserves nothing and accepts the run when at least one eligible alternative fits.
Authored production Clock marker help:
  value: Marks this line as the one attempted by the item's Clock interval.
Authored production Default marker help:
  value: Marks the line selected when no other authored or runtime selection overrides it.
Authored production Enabled marker help:
  value: |
    Sets whether the line starts enabled.

    Runtime rules may still change availability after the game begins.
Authored production Visible marker help:
  value: |
    Sets whether the line starts visible to the player.

    Visibility rules may still show or hide it at runtime.
Authored production inputs summary help:
  value: |
    Every visible requirement must be satisfied before the line starts.

    - **Consumed materials** are removed.
    - **Reserved materials** return when work finishes.
    - **Owner Units** are spent from this item.
    - **Required Units** are spent from a matching Board item.
Authored production line output summary help:
  value: |
    The line may complete without producing an item.

    When configured, output resolves through its alternative sets, independent rolls, weighted candidates, placement, and per-drop rules.
Authored production output summary help:
  value: |
    Resolves after this production line completes.

    Alternative sets compete by relative weight, while every roll inside the selected set resolves independently.
Authored production rules summary help:
  value: |
    Rules control this line's visibility, availability, and runtime.

    Every positive gate must pass; matching veto rules win. Runtime adjustments apply only while their conditions match.
Authored production runtime summary help:
  value: |
    The base time required to finish one run.

    Matching runtime rules may add or subtract time or multiply this value while the game is running.
Authored production summary help:
  value: |
    Production is enabled when the item has at least one product line.

    Each line owns its requirements, runtime, output, and availability rules. Queue capacity is shared by all lines on the item.
Authored queue capacity summary help:
  value: |
    The maximum accepted work across all product lines on this item.

    The count includes **one active job** plus queued requests.
