Item artwork help:
  value: |
    Artwork combines a base image with an optional overlay.

    **Base tile scale** sizes both images together. `1` uses the whole image canvas; transparent PNG padding still counts. Scale changes appearance only, never occupied cells.

    The preview updates immediately and matches Item detail.
Item clock empty title:
  value: Automate production or give this item a limited lifetime.
Item clock help:
  value: |
    Clock adds repeating production, a limited Lifetime, or both.

    - **Interval** selects a weighted interval line. Leave empty for no repeating production.
    - **Lifetime** selects a weighted expiry line when the timer ends. Leave empty for no time limit.
    - **Wait for output** lets earlier work and the expiry job finish before removal.
    - **Stop immediately** cancels earlier work; the expiry job still finishes, discarding output that cannot fit.
    - Every Enable rule must pass; any matching Disable rule pauses the Clock.

    Time advances in every location while Clock rules allow it; production pulses require a Board. An item held inside another job skips the expiry line's inputs and runtime and immediately settles its output.
Item connections help:
  value: |
    Connections searches the project's authored graph. Choose a relationship type and optionally a counterpart.

    - **All relationships** includes incoming and outgoing links, including rules, merges, spaces and templates.
    - **Merges into** shows the targets of this item's merges. **Accepts merge from** finds items with a merge targeting this item.
    - **Inputs** and **Required by** follow line materials, selectors and unit costs.
    - **Produces** and **Produced by** follow authored outputs and replacements.
    - **Rule references** and **Referenced by rules** keep condition mentions separate from consumed inputs.

    Every arrow keeps its authored direction. Repeated links remain separate occurrences. **Details** preserves exact source paths, alternative groups, chance and guards; the operation link opens its owner for editing.
