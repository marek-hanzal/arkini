name: macOS Development Prerelease

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-dev.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: macos-prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build release-channel macOS arm64 artifacts
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ARKINI_RELEASE_ISSUER: https://token.actions.githubusercontent.com
      ARKINI_RELEASE_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/macos-prerelease.yml
      ARKINI_RELEASE_SIGN: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install dependencies
        run: ./Argcfile.sh install

      - name: Use tag version for release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: ./Argcfile.sh version "${GITHUB_REF_NAME#v}"

      - name: Package macOS arm64 application
        run: ./Argcfile.sh package-macos

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: arkini-macos-arm64-${{ github.run_number }}
          path: |
            .out/desktop/release/*.dmg
            .out/desktop/release/*.zip
            .out/desktop/release/*.arkpack
            .out/desktop/release/*.arksig
            .out/desktop/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            .out/desktop/release/*.dmg \
            .out/desktop/release/*.zip \
            .out/desktop/release/arkini.arkpack \
            .out/desktop/release/arkini.arksig \
            .out/desktop/release/SHA256SUMS \
            --verify-tag \
            --prerelease \
            --title "Arkini $GITHUB_REF_NAME" \
            --notes "Unsigned macOS Apple Silicon build plus its standalone official Arkpack and Sigstore bundle. Verify SHA256SUMS before opening and use the normal macOS Gatekeeper override."
