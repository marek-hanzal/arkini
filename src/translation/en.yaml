Production:
  value: Production
Production disable rule help:
  value: |
    **Disable** makes this line unavailable while all its conditions match.

    It wins over **Enabled** and every Enable rule. Visibility is separate.
Production enable rule help:
  value: |
    **Enable** adds a required check for this line.

    If several Enable rules exist, **all of them** must pass. Any matching Disable rule still blocks the line.
Production hide rule help:
  value: |
    **Hide** conceals this line while all its conditions match.

    It wins over **Visible** and every Show rule. Work already in the queue continues.
Production input type help:
  value: |
    Choose what this line needs before it may start:

    - **Simple:** nothing.
    - **Materials:** delivered items.
    - **Units:** Units from this item or a matching Board item.
Production inputs help:
  value: |
    **Every input must be ready before the line starts.**

    At least one input is required. Use **Simple** when the line intentionally needs nothing; Materials and Units add real costs.
Production line:
  value: Production line
Production line Clock help:
  value: |
    Includes this line in the weighted pool tried on every Clock interval.

    Line rules are evaluated before selection; only enabled lines enter the pool. Visibility does not affect selection. Changing the pool does not restart the Clock.
Production line default help:
  value: |
    The initial line selected for manual production.

    Only one line may hold this role. It is separate from the **Clock** pool.
Production line enabled help:
  value: |
    Whether this line starts enabled.

    Enable and Disable rules may change it during play. Visibility is separate.
Production line rules help:
  value: |
    These rules affect only this line.

    - **Show/Hide** controls whether players see it; Hide wins.
    - **Enable/Disable** controls whether it may start; every Enable must pass and Disable wins.
    - **Time** rules multiply the duration first, then add or subtract seconds.

    Other lines and queued work keep their own settings.
Production line runtime help:
  value: |
    How long one job normally takes.

    Time multipliers apply first, then adjustments. A result of zero finishes on the next game update.
Production line visibility help:
  value: |
    Whether players see this line at the start.

    Show and Hide rules may change it. Visibility does not decide whether the line may run.
Production outcome help:
  value: Production outcome help
Production queue capacity help:
  value: |
    Maximum work accepted across all lines on this item.

    The active job counts, so capacity **3** means one active job plus at most two waiting.
Production runtime adjustment rule help:
  value: |
    Adds or subtracts seconds while all conditions match.

    Time multipliers run first. Negative results stop at zero.
Production runtime multiplier rule help:
  value: |
    Multiplies production time while all conditions match.

    Several matching multipliers combine before any time adjustments.
Production show rule help:
  value: |
    **Show** reveals this line while all its conditions match.

    Any matching Hide rule still wins. Availability is separate.
