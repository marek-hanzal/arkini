Target space help:
  value: |
    Zero-based Board Space entered after successful activation.

    Navigation may be one-way. A drop onto this item uses the same target Space but does not activate the action or change the player's current Space.
Target unit cost help:
  value: |
    Configures the Board item that pays when this action or production job starts.

    - **Selected item:** the item type that may pay. Only items with **Units** enabled are available.
    - **Board distance:** how far from the owner the engine may search for the payer.
    - **Cost:** units removed from the matching item each time the action or job starts. It stays disabled until an item is selected and cannot exceed that item's authored Units deposit.

    The payer stays in place. Spending its final unit resolves that item's normal depletion behavior.
