Merge outcome:
  value: Merge outcome
Merge outcome help:
  value: |
    Choose what else happens after the dragged item and receiver are handled. For example, using a key on a chest can remove the chest and drop treasure. Leave this empty if changing the two items is the whole result.

    Add outcome sets for different possible results. Rules decide which sets are available; if several qualify, their weights choose one. Every roll in the chosen set is then checked; chance and individual rules can still prevent some results. If there is no eligible set, the merge creates nothing extra.
Merge source consume help:
  value: |
    **Consume** removes one dragged item, not one Unit.

    Example: **Match + Unlit Candle → Candle** consumes one Match.
Merge source space help:
  value: |
    **Space** sends any item dropped onto this item to the target space, preserving its identity and state. An explicit merge on the dragged item takes priority.

    **Target item** controls this receiving item. Extra outcomes use this receiver's original Board position. Transport does not switch the player's space; a Space outcome can do that separately.

    A full destination or failed effect cancels the whole interaction. Each item can define one Space merge.
Merge source spend help:
  value: |
    **Spend** removes one Unit from the dragged item and keeps it in place.

    At zero Units, that item depletes and may create its depletion output.
Merge source use help:
  value: |
    **Use** keeps the dragged item in its original cell.

    Items with Units, Clock state, stored inputs or production work cannot be reused this way. A plain reusable tool works well.
Merge target keep help:
  value: |
    **Keep** leaves the target item unchanged.

    The dragged item and optional merge output still do their part. Useful for keys, tools or payments.
Merge target remove help:
  value: |
    **Remove** deletes one target item.
Merge target replace help:
  value: |
    **Replace** swaps one target item for **Replace by** in the same cell.

    Units transfer only to a compatible replacement.
Merge target spend help:
  value: |
    **Spend** removes one Unit from the target and leaves it in place.

    At zero Units, that item depletes and may create its depletion output.
Merge with:
  value: Merge with
Merge with help:
  value: |
    Choose which item this one can be dropped **onto**. This merge rule belongs to the item you are editing: dragging it onto the chosen item triggers the rule.

    This item is the dragged item. **Source action** decides whether it stays, disappears, or spends a Unit. **Target effect** decides what happens to the item receiving it.

    Extra **Merge outcome** rules use the dragged item's Board position, and local results appear near it. If the target runs out of Units, its separate depletion outcome uses the target's own position.

    Dragging the chosen item back onto this one does not trigger the same rule. That direction needs its own merge rule on the other item.
