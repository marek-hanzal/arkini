Authored Clock interval summary help:
  value: |
    How often the Clock selects one eligible weighted production line.

    **None** means no repeating production. Lifetime can still expire.
Authored Clock kill-switch summary help:
  value: |
    **Stop immediately** removes the item at the end of its Lifetime, even if a job is unfinished or output has nowhere to go.
Authored Clock lifetime summary help:
  value: |
    How long the item may stay on a Board before it expires.

    **Unlimited** means it never expires on its own.
Authored Clock loose-kill summary help:
  value: |
    **Wait for output** lets started jobs finish before the expired item disappears. If output has nowhere to go, the item waits too.
Authored Clock status summary help:
  value: |
    The Clock's starting state.

    Rules can still enable or disable it during play.
Authored Clock summary help:
  value: |
    Clock gives the item time-based behavior:

    - **Interval** repeatedly tries the selected production line.
    - **Lifetime** expires the item and may create an output.

    Lifetime also works without production.
Authored Units amount summary help:
  value: |
    Units stored inside each new item.

    Each item keeps its own supply.
Authored Units depletion outcome summary help:
  value: Authored Units depletion outcome summary help
Authored Units summary help:
  value: |
    Units are a spendable supply inside each item.

    Spending Units affects only that item.
Authored artwork summary help:
  value: |
    Combines a base image and optional overlay at one shared scale.

    Artwork changes only appearance, never placement or gameplay.
Authored merge outcome summary help:
  value: |
    Extra results this merge can create after it changes the dragged and target items.

    For example, opening a chest can remove the chest and drop treasure. If there is no extra outcome, the changes to the two items are the whole result.
Authored merge source action summary help:
  value: |
    What happens to the item you drag:

    - **Use:** keep it.
    - **Consume:** remove one item.
    - **Spend:** remove one Unit.
    - **Space:** receive any dragged item and send that same instance to the configured space.
Authored merge target effect summary help:
  value: |
    What happens to the item receiving the drop:

    - **Keep:** leave it.
    - **Remove:** remove one item.
    - **Replace:** swap one item.
    - **Spend:** remove one Unit.
Authored merge target summary help:
  value: |
    The item you drop this item **onto**.

    Direction matters: A onto B is different from B onto A.
Authored merges summary help:
  value: |
    Use, Consume and Spend start when you drop this item onto its selected target. Space starts when another item is dropped onto this one, unless that item owns an explicit merge for this target.

    It updates or transports the dragged item, updates the receiving item, then applies any extra outcome.
