Weighted candidate weight help:
  value: |
    Relative chance of selecting this candidate on each pick.

    Weights are ratios: candidates weighted **70** and **30** have 70% and 30% odds per pick. A candidate remains eligible for later picks.
Weighted candidates help:
  value: |
    Candidates are the alternatives considered by a Weighted roll.

    Each pick selects exactly one candidate by relative weight and emits every drop inside it. At least two candidates are required for a valid weighted choice.
Weighted roll type help:
  value: |
    Performs the configured number of independent weighted selections.

    Each selection chooses one candidate by relative weight. Candidates are not removed after selection, so the same candidate may win repeatedly.
Weighted selections:
  value: Weighted selections
Weighted selections help:
  value: |
    Controls how many independent candidate picks this Weighted roll performs.

    - **1–1:** exactly one weighted reward.
    - **3–3:** exactly three picks.
    - **2–4:** randomly two, three, or four picks.

    Every pick uses the same candidate weights, and the same candidate may be selected more than once.
