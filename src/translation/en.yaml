Item player controls help:
  value: |
    **Interactive** allows players to start production, store or withdraw input materials, change the queue, and select the **Default** and **Clock** lines.

    **Automatic only** disables those production controls and leaves authored automation in charge. It does not change movement, merge or removal rules.
Item production empty title:
  value: Let this item produce other items.
Item production help:
  value: |
    Production shows the authored production lines. Queue capacity and player controls are shown on the Item page. Clock settings have their own Clock tab and remain visible in the Item overview. Each line has its own runtime, visibility, availability rules, inputs and optional output.

    **Default** selects the manual click line. **Clock** independently selects the line attempted at every timer pulse. Selecting either role clears only that role on the other lines. Without a Clock line, the timer continues without adding work.

    Manual and automatic requests use the same queue in admission order. Queue capacity includes the active job. A blocked or full queue skips a Clock pulse without storing missed work.

    **Interactive** allows manual production, material management, queue changes and line selection. **Automatic only** removes those player controls.

    Clock can also give an item a finite lifetime without any lines. **Loose-kill** lets accepted production settle before expiry; **Kill switch** cancels unfinished work at expiry and may lose materials or expiry outputs that cannot be placed. Adding a production line removes the configured Action when the draft is saved.
Item search shortcuts:
  value: ↑↓ Select · Enter Open · Esc Close
Item section copy help:
  value: |
    In the edit form, **Copy from** selects another saved item in this project. Confirm to replace the **entire active section**, including its unsaved changes. Collections are replaced in full, never merged; an absent optional section removes it from the destination. The source item stays unchanged.

    **Save** persists the replacement together with the rest of your draft. **Discard** restores the saved destination item. Item references retain their authored targets; self-paid unit inputs bind to the destination when saved.

    - **Item:** copies title, description, player controls, storage, stack and global limits. Item ID, UID and draft status stay unchanged. An existing Clock keeps a stack size of one.
    - **Artwork:** replaces base artwork, overlay and scale.
    - **Production:** replaces all lines and queue capacity. Nonempty production removes the destination action.
    - **Merges:** replaces all merge rules and their outputs.
    - **Units:** replaces amount and depletion output.
    - **Clock:** replaces timing, enabled state, rules and expiry output. A copied Clock removes the destination action and sets a stack size of one.
    - **Action:** replaces the complete action, inputs and rules. A copied action removes destination production lines and Clock.
Item stack size help:
  value: |
    The maximum quantity that can share one cell as a stack. This is separate from **Units**, the finite supply inside one item. A configured **Clock** requires a stack size of one.
