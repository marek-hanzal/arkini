Weighted candidates:
  value: Weighted candidates
Weighted candidates help:
  value: |
    The choices available to a Weighted roll.

    Each pick selects one candidate by weight and creates every drop inside it. Add at least two candidates.
Weighted roll type help:
  value: |
    Makes the number of independent picks configured under **Selections**.

    Each pick chooses one candidate by weight. Candidates stay available, so one may win several times.
Weighted selections:
  value: Weighted selections
Weighted selections help:
  value: |
    How many picks this Weighted roll makes.

    - **1–1:** exactly one.
    - **3–3:** exactly three.
    - **2–4:** randomly two, three or four.

    Every pick uses the same candidate weights.
