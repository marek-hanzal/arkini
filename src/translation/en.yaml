Item ID:
  value: Item ID
Item action empty title:
  value: Let a click open Inventory or move to another space.
Item action help:
  value: |
    Action is the item's immediate click handler. Choose **Space** to enter a target board space or **Inventory** to open Inventory.

    All input costs and rules must pass before activation. Every Enable rule must pass; any matching Disable rule prevents the action. Switching action kind keeps shared inputs and rules.

    Enabling Action removes production lines and Clock from the draft. **Save** applies the change; **Discard** keeps the saved configuration.

    Inside Inventory, clicking always releases the item to the first free compatible Board or Toolbar cell. It never runs that item's action. This also lets an inventory-opening item be stored and released normally.
Item artwork help:
  value: |
    Artwork combines a base asset with an optional overlay, drawn back to front.

    **Base tile scale** changes the artwork size within its tile. A value of 1 fills the tile with the artwork canvas; transparent PNG padding remains visible. Scale does not change occupied cells, storage, interaction reach, or image resolution.

    The artwork preview in Item detail marks the complete tile.
Item clock empty title:
  value: Automate production or give this item a limited lifetime.
Item clock help:
  value: |
    A Clock adds periodic production, a finite lifetime, or both.

    - **Interval** attempts the line marked Clock periodically. Leave it empty for a one-shot lifetime without pulses.
    - **Lifetime** sets how long the timer may run. Leave it empty for an unlimited lifetime.
    - At least one timer is required. **Expiry output** is available only with a lifetime and is emitted after accepted production settles.

    **Enabled** and availability rules determine whether the timer runs. Every Enable rule must pass; any matching Disable rule pauses it. Accepted production keeps its own line rules.

    Enabling Clock removes the item's action and requires Board storage with a stack size of one. New clocks start with a five-minute interval and a one-hour lifetime.
Item connections help:
  value: |
    Connections explores one explicit authored relationship for any item.

    - **Required by** lists authored owners that directly input this item or positively require it in a production condition.
    - **Inputs** shows those same direct inputs and positive conditions from the selected owner's side.
    - **Produces** lists the direct outputs of authored operations owned by the selected item.

    Use the search to find an item in the active relationship list. Open any result to inspect that item without losing the selected relationship.
Item delete help:
  value: |
    Delete checks the saved project for references to this item. Follow a blocker to inspect its owner before deleting.

    Ordinary deletion requires those references to be removed. **Force delete** also removes the listed starting entries, operations and outputs that depend on this item; review the concrete impact in the confirmation dialog.

    Asset files remain in the project. Linked Notes remain, with this item's link removed. Deletion is applied only after confirmation.
Item depletion output empty title:
  value: Create items when the last unit is spent.
Item estimate help:
  value: |
    Estimate answers a practical question: **what would the game roughly need to obtain this item?** It follows starting items and production rules until it finds one complete route.

    This is a planning preview, not a simulation or a promise.

    ### Reading the result

    - Each row is an item needed somewhere along the selected route.
    - **Quantity** is the approximate amount the route consumes or requires.
    - **Time** is how much that part contributes to the optimistic total.
    - The Time and Quantity buttons only reorder the same result.

    Arkini uses authored runtimes, output quantities and chances. Random outputs are converted into an expected number of attempts. Independent work can happen in parallel, so its time is not blindly added together.

    Real play may take longer or choose another route because player decisions, placement, timing and actual random rolls are not simulated. **Partial** or **unreachable** means the authored data did not provide one complete calculable path.
Item expiry output empty title:
  value: Create items when this item's lifetime ends.
Item global count help:
  value: |
    Limits the total quantity of this item across the game. Stack quantities contribute to the same global limit. Leave empty for no global limit.
Item identity help:
  value: |
    Item brings together identity, artwork, storage limits and the optional unit supply. Use each section's **Edit** action to open its exact settings.

    **Storage scope** controls placement on Board, Toolbar and Inventory. **Stack capacity** counts separate items in one stack; **Units** are the supply inside each item. **Game limit** limits the item across the game.

    Item IDs can be renamed with their project references. The UID remains the item's stable identity. Artwork changes appearance without changing occupied cells.

    **Draft** is saved immediately as an Editor organization flag. Draft items still participate in the game and the built Arkpack. Other edits are applied with **Save**; **Discard** leaves the saved item unchanged.
Item interactions help:
  value: |
    Interactions describes what happens when a player clicks this item or drops it onto another item.

    - **Action** is an immediate click interaction: enter a Space or open Inventory after its inputs and rules pass.
    - **Merges** are directional drop interactions. Their source action and target effect are independent, with an optional extra output.

    Action cannot coexist with production lines or Clock. Merges are configured independently. Use the local **Edit** links to change either interaction.
Item list help:
  value: |
    Browse the project's saved items by title or ID. Open an item to inspect its capabilities, acquisition estimate, connections and Notes.

    **Draft** filters to items marked as drafts. This is an Editor organization flag: drafts still participate in the game and Arkpack builds.

    **New item** opens an unsaved draft. You can also create an item from an asset, which supplies its initial artwork and title. Save applies changes to the project.
Item merge output empty title:
  value: Create extra items when this merge completes.
Item merges empty title:
  value: Define what happens when this item is dropped onto another.
Item merges help:
  value: |
    Merges trigger when this item is dropped onto a matching target.

    The **Source action** decides whether the dropped item is consumed, retained, or spends a unit. The **Target effect** decides what happens to the target. A merge may also emit an extra output.

    Enable merges to add the first interaction, then select a target and configure both sides. Changes take effect when you save.
Item notes empty description:
  value: Create a note here to keep ideas and decisions linked to this item.
Item notes empty title:
  value: No notes for this item yet
Item player controls help:
  value: |
    **Interactive** allows players to start production, store or withdraw input materials, change the queue, and select the **Default** and **Clock** lines.

    **Automatic only** disables those production controls and leaves authored automation in charge. It does not change movement, merge or removal rules.
Item production empty title:
  value: Let this item produce other items.
Item production help:
  value: |
    Production combines the item's queue, Clock and production lines. Queue capacity and player controls are shown on the Item page. Each line has its own runtime, visibility, availability rules, inputs and optional output.

    **Default** selects the manual click line. **Clock** independently selects the line attempted at every timer pulse. Selecting either role clears only that role on the other lines. Without a Clock line, the timer continues without adding work.

    Manual and automatic requests use the same queue in admission order. Queue capacity includes the active job. A blocked or full queue skips a Clock pulse without storing missed work.

    **Interactive** allows manual production, material management, queue changes and line selection. **Automatic only** removes those player controls.

    Clock can also give an item a finite lifetime without any lines. Accepted production may outlive that lifetime; expiry output waits for settlement. Adding a production line removes the configured Action when the draft is saved.
Item stack size help:
  value: |
    The maximum quantity that can share one cell as a stack. This is separate from **Units**, the finite supply inside one item. A configured **Clock** requires a stack size of one.
