Starting layout controls help:
  value: |
    ### Starting layout controls

    - **Click** an empty slot to choose an item, or click a stack to add one.
    - **Right-click** a stack to remove it.
    - Hold **Alt/Cmd** and drag, or use **Alt/Cmd + Arrow**, to move a stack. Anything at the destination is replaced.
    - Press **Minus** to remove one item or **Delete** to remove the whole stack.
