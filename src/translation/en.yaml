Chain empty description:
  value: This item owns no merge or Clock. Incoming merges belong to their source item's Chain.
Chain help:
  value: |
    Chain is an overview of an authored interaction and its automatic consequences.

    - The starting item owns the merge direction. Dropping A onto B is separate from dropping B onto A; only the starting item's own merge rules are listed.
    - The starting item's own Clock is also available. After the first operation, only Clock expiry and the output of its Clock-selected production line continue. Intermediate merge rules and production input chains are ignored.
    - Each emitted item without a Clock ends its branch. Results include items emitted along the way. Click a result item to open its Chain tab and start a new investigation, including that item's own merges.
    - Periodic output is shown once per admitted line run, with its interval, line duration and owner lifetime. It is not an accumulated yield or a promise of successful production.
    - Details reveals each operation. Quantities belong to that operation, not the whole chain. Output sets are alternatives; rolls within a selected set run together; weighted candidates are alternatives per selection. Conditions and chance remain visible.
    - Exploration follows up to five steps. Each merge or Clock operation counts as one step. Depth limits and Clock loops are unfinished paths, not final items. Reaching the safety limit explicitly reports incomplete exploration.
    - Retained merge participants keep their existing runtime state; their Clock is not restarted. Spending a unit is marked separately, with conditional depletion output when configured.
    - This is authored inspection, not runtime simulation. Disabled defaults, conditions, inputs, jobs and blocked placement may prevent or delay an outcome. Times are local configured durations, not guaranteed elapsed times. Kill switch may cancel unfinished production and discard outputs that cannot fit; Chain still shows the authored output possibilities.
Chain pulse explanation:
  value: Shown once per admitted run. The owner remains until expiry. Inputs, availability, queueing and output placement can delay or prevent production.
Chain safety limit:
