Notes help:
  value: |
    Notes are a free-form space for ideas, design thoughts, reminders, rough plans, and any other useful project stuff.

    Write them in **Markdown**. Notes stay with the Editor project, but **they are not versioned with it**: creating or restoring a Version does not capture or roll back your notes. They are also excluded from the built Arkpack, so they never affect the game.
