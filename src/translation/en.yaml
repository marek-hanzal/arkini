Item estimate help:
  value: |
    Estimate answers: **roughly what does the game need to obtain this item?**

    ### Reading it

    - **Quantity** is the approximate amount needed along one complete route.
    - **Time** is that step's contribution to the optimistic total.
    - Random rewards use their average number of attempts.
    - Work that can happen together is counted in parallel.

    This is a planning shortcut, not a playthrough. Full queues, placement, player choices and unlucky rolls can make real play slower. **Incomplete** means the calculation hit a limit; **Unreachable** means no complete route starts from the project's starting items.
Item expired:
  value: Item expired
  dynamic: true
Item identity help:
  value: |
    The Item page is the overview: artwork, Production, Merges, Units, Clock and Action in one place.

    - Each cell holds one item.
    - **Show all** opens the full detail page for a section; **Edit** opens its form.

    Action cannot coexist with Production or Clock. Merges work independently.

    Renaming **Item ID** updates project links; UID never changes. **Draft** is saved immediately and marks work in progress, but the item still runs and builds normally.
Item interface:
  value: Item interface
Item interface help:
  value: |
    **Simple** shows only item information. Board clicks can run the Default line, including filling its queue. Without a Default line, clicks do not start production. Players cannot directly select other production lines, manage inputs or queues, or change Default and Clock selections.

    **Default** shows all sections, even without production lines, and enables ordinary manual production.

    Clock, Actions, movement and merges keep their own rules.
Item list help:
  value: |
    Browse saved items by title or ID. Cards show artwork, Estimate, Demand, Draft status and linked Notes.

    ### Filters and sorting

    - Sort by **Name**, estimated time or highest Demand.
    - **Unreachable** includes incomplete routes.
    - **With note** and **Draft** combine with search and sorting.

    **Estimate** is the optimistic time to obtain one item. **Demand** approximates how much of it is needed across reachable item routes. Both are planning hints, not balance verdicts.

    **New item** opens an unsaved draft. Creating from Artwork fills its first title and artwork for you.
Item merges empty title:
  value: Define what happens when this item is dropped onto another.
Item merges help:
  value: |
    A merge starts when you drop this item onto the selected **Merge with** item.

    - **Dragged item** decides what happens to the item you moved.
    - **Target item** decides what happens to the item receiving it.
    - **Merge output** may create extra items afterward.

    Direction matters: A onto B is not B onto A. Changes start working after **Save**.
