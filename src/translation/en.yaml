Item artwork help:
  value: |
    Artwork combines a base image with an optional overlay.

    **Base tile scale** sizes both images together. `1` uses the whole image canvas; transparent PNG padding still counts. Scale changes appearance only, never occupied cells.

    The preview updates immediately and matches Item detail.
Item clock empty title:
  value: Automate production or give this item a limited lifetime.
Item clock help:
  value: |
    Clock adds repeating production, a limited Lifetime, or both.

    - **Interval** tries the line marked Clock. Leave empty for no repeating production.
    - **Lifetime** expires the item. Leave empty for no time limit.
    - **Wait for output** lets started jobs finish before removal.
    - **Stop immediately** cancels unfinished work at expiry; anything that cannot fit is lost.
    - Every Enable rule must pass; any matching Disable rule pauses the Clock.

    Time advances in every location while Clock rules allow it; production pulses require a Board. Enabling Clock removes Action.
Item connections help:
  value: |
    Connections answers four quick questions:

    - **Required by:** which items need this one?
    - **Inputs:** what does this item need?
    - **Produces:** what can this item create?
    - **Produced by:** what can create this item?

    Rows show the exact production line, action, merge, depletion or Clock behind the link. Search filters the current list; opening a result keeps the selected relationship.
