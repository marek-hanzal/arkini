Asset ID help:
  value: |
    A unique resource name within this project. Renaming updates saved item, project and note references when you **Save**.
Asset PNG import summary:
  value: Import selected PNG images. Filenames become resource IDs.
Asset catalog help:
  value: |
    Assets contains reusable PNG images in the project. Search by asset ID and choose All, Unused, or With note to show assets linked to project notes. Open an asset to preview it, inspect its uses, replace it or create an item from it.

    **Import** adds PNG files or imports images from an Arkpack. **Optimize** losslessly re-encodes project PNGs at their original dimensions; it does not resize the artwork.

    Replacing a saved image changes every use of that asset. Creating an item starts an unsaved draft with artwork and a title derived from the asset; Save publishes the item.
Asset delete available description:
