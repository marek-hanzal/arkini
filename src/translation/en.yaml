Item production help:
  value: |
    Production contains the jobs this item can perform.

    - **Default** is the initial line for manual production.
    - **Clock** marks lines for weighted selection at every Clock interval. Line rules filter the pool before one line is selected.
    - All lines share one queue; the active job counts toward its size.
    - A failed Clock attempt is skipped, not saved for later.
    - Item interface **Default** enables player controls; **Simple** permits Board clicks on the Default line while hiding production controls.

    Adding Production removes Action when you save. Clock may also exist without any line when you only need a Lifetime.
Item search shortcuts:
  value: ↑↓ Select · Enter Open · Esc Close
Item section copy help:
  value: |
    **Copy from** replaces the whole open section with values from another saved item. Unsaved changes in this section are replaced too; the source item never changes.

    - **Item** keeps Item ID, UID and Draft.
    - **Production** copies every line and queue size; nonempty Production removes Action.
    - **Clock** removes Action.
    - **Action** removes Production and Clock.
    - Artwork, Merges and Units replace their complete section.

    Lists are replaced, never combined. **Save** keeps the copy; **Discard** restores the destination item.
