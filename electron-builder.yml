appId: dev.marekhanzal.arkini
productName: Arkini
asar: true
asarUnpack:
  - node_modules/@ngrok/ngrok-darwin-arm64/**/*.node
npmRebuild: false
electronLanguages:
  - cs-CZ
  - en-US
  - en-GB
  - en_GB
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
extraMetadata:
  main: app/main/index.js
directories:
  output: .out/desktop/release
  buildResources: electron/resources
files:
  - '!node_modules/**/*'
  - package.json
  - node_modules/@ngrok/ngrok/**/*
  - node_modules/@ngrok/ngrok-darwin-arm64/**/*
  - from: .out/desktop/build
    to: app
    filter:
      - '**/*'
      - '!**/*.map'
extraFiles:
  - from: electron/resources/arkini-cli
    to: MacOS/arkini-cli
extraResources:
  - from: game/arkini/build
    to: game
    filter:
      - arkini.arkpack
      - arkini.arksig
mac:
  category: public.app-category.games
  icon: icon.png
  identity: null
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
dmg:
  title: ${productName} ${version}
