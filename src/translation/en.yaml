Editor Board help:
  value: |
    Editor Board runs the current saved project as a real, live game inside the Editor. Use it to verify how starting items, production, merges, units, placement, and item interactions behave together. Changes made while playing are temporary and do not modify the authored project data.

    Press `Cmd+P` (`Ctrl+P` on Windows and Linux) to find and spawn any item that can exist on the Board. **Default** runs authored durations so time-based behavior remains visible. **Instant** removes waiting time while preserving normal requirements, placement, units, and lifecycle rules.

    The live Board session is disposable. It has no saved scenarios and does not change authored project data.
Editor MCP:
  value: Editor MCP
Editor MCP help:
  value: |
    MCP lets AI tools work with the project currently open in Arkini. A connected client can inspect and edit project data and Notes, run validation, and explore item relationships.

    > **Treat every connection as full project access.** Only connect clients you trust, and keep the intended project open in Arkini while they work.

    ### Local MCP

    Use **Local MCP** for Codex or another MCP client running on this Mac. Start the local server, then copy its loopback endpoint into the client. Local MCP stays on this computer and does not require ngrok.

    ### Remote MCP

    Remote MCP exposes the open project through an OAuth-protected HTTPS endpoint. It requires:

    1. An **ngrok account** with a Development Domain.
    2. A dedicated, revocable **ngrok authtoken**.
    3. A remote MCP client that supports OAuth.

    Open **Settings**, enter the Development Domain as a hostname without `https://` or a path, paste the authtoken, and save the configuration. Return to **Server**, start Remote MCP, and copy the published endpoint into the client.

    On its first connection, the client opens Arkini's authorization page. Enter the **Remote password** shown here to approve it. **Refresh** creates a new password, stops Remote MCP, and disconnects existing remote clients.
