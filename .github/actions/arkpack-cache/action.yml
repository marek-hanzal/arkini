name: Prepare Community Arkpack cache
description: Restore the repository game build using the canonical Argcfile fingerprint.
runs:
  using: composite
  steps:
    - name: Compute canonical Arkpack fingerprint
      id: fingerprint
      shell: bash
      run: |
        fingerprint=$(./Argcfile.sh arkpack-fingerprint)
        [[ "$fingerprint" =~ ^[a-f0-9]{64}$ ]]
        echo "value=$fingerprint" >> "$GITHUB_OUTPUT"
    - name: Restore Community Arkpack and checksum
      uses: actions/cache@v5
      with:
        path: game/arkini/build
        key: community-arkpack-${{ runner.os }}-${{ runner.arch }}-${{ steps.fingerprint.outputs.value }}
