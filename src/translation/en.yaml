Item delete help:
  value: |
    Delete first shows every saved place that still uses this item.

    Remove those links normally, or use **Force delete** to remove the listed starting items, requirements and outputs too. The confirmation shows the exact damage before anything happens.

    Artwork files and Notes stay; only this item's note links are removed.
