Merge source consume help:
  value: |
    **Consume** permanently removes one source quantity. It consumes the item itself, not one unit.

    Example: **Match + Unlit Candle → Candle** removes one Match. Removing the final quantity also disposes state owned by that source identity.
Merge source spend help:
  value: |
    **Spend** removes one unit from the source item while keeping the item itself.

    Spending the last unit depletes one source item and resolves its depletion output. The source must have **Units** configured before this option is valid.
Merge source use help:
  value: |
    **Use** returns one source quantity near the target through normal placement and does not spend units.

    The source must be stateless enough to split safely: spent units, remaining lifetime, buffered inputs, or jobs block the merge. Example: a reusable tool returns unchanged.
Merge target keep help:
  value: |
    **Keep** leaves the complete target stack and its runtime state unchanged.

    The source action and optional merge output still resolve. Use this for keys, tools, or payments acting on a persistent target.
Merge target remove help:
  value: |
    **Remove** permanently removes one target quantity.

    A larger stack keeps its remaining quantities. The source follows its separately configured Source action.
Merge target replace help:
  value: |
    **Replace** swaps one target quantity for the selected replacement in the same Board cell.

    A larger target stack is split nearby. Spent units carry over only to a compatible replacement with Units; other state that cannot transfer blocks the merge.
Merge target spend help:
  value: |
    **Spend** removes one unit from the target while leaving it in place.

    Spending the final unit depletes one target item and resolves that item's depletion output. The selected target must have **Units** configured.
