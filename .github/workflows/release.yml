name: Stable Release Artifacts

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: ${{ !contains(github.ref_name, '-') }}
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            command: package-macos
            artifact: arkini-macos-arm64
          - name: Windows x64
            os: windows-2025
            command: package-windows
            artifact: arkini-windows-x64
          - name: Linux x64
            os: ubuntu-24.04
            command: package-linux
            artifact: arkini-linux-x64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out release commit
        uses: actions/checkout@v6

      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install dependencies
        run: ./Argcfile.sh install

      - name: Use tag version for release artifacts
        run: ./Argcfile.sh version "${GITHUB_REF_NAME#v}"

      - name: Package release artifacts
        run: ./Argcfile.sh "${{ matrix.command }}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}-${{ github.ref_name }}
          path: |
            .out/desktop/release/*.dmg
            .out/desktop/release/*.exe
            .out/desktop/release/*.AppImage
            .out/desktop/release/*.zip
            .out/desktop/release/*.arkpack
            .out/desktop/release/SHA256SUMS*
          if-no-files-found: error
          retention-days: 30
