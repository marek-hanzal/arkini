    It does not move the item or grant extra storage space.
Inventory action summary help:
  value: |
    Opens Inventory after every rule and requirement passes.

    It does not move the item or run production.
Inventory action type help:
  value: |
    **Inventory** opens global Inventory after rules pass and Unit costs are paid.

    It grants no extra storage space.
Inventory editing help:
