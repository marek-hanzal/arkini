Editor MCP:
  value: Editor MCP
Editor MCP help:
  value: |
    MCP lets Codex and other AI tools read and edit the project currently open in Arkini.

    > A connected client has full project access. Connect only tools you trust and keep the intended project open.

    ### Local MCP

    Start **Local MCP** and copy its address into a client running on this computer. No ngrok needed.

    ### Remote MCP

    Remote access needs an **ngrok Development Domain**, a dedicated **authtoken**, and an MCP client with OAuth support.

    1. Save the domain without `https://` or a path, then paste the authtoken.
    2. Return to **Server** and start Remote MCP.
    3. Copy the published address into your client.
    4. When Arkini asks, paste the password from **Copy password**.

    The token is stored unencrypted on this device, so use one you can revoke. **Reset password** stops Remote MCP and disconnects existing clients.
