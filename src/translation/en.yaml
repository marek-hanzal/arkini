    Choose music to set the mood while the player explores this item's detail. Use **Play** to listen before choosing.

    The music fades in gently and keeps playing while the detail is open. Each repeat starts somewhere different in the track, so it doesn't always sound the same.

    When the player closes the detail, the previous music picks up where it left off. Opening another item switches to that item's music, or returns to the regular playlist if none is set.

    Leave **Music** empty to keep the regular playlist playing.
