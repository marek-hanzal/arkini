    Inventory is shared storage available from every Space.

    **Width** and **Height** set the same grid everywhere.
Item:
  value: Item
Item ID:
  value: Item ID
Item ID help:
  value: |
    The stable name used by production, merges, rules, Board layouts and MCP.

    Renaming it updates project links when you **Save**. Keep it short, for example `healing-kit`. Text outside Arkini cannot be updated.
Item action empty title:
  value: Let a click open Inventory or move to another space.
Item action help:
  value: |
    Action runs when the player uses this item.

    - **Space** enters a chosen Board Space.
    - **Inventory** opens global Inventory.
    - Every Enable rule must pass; any matching Disable rule blocks the action.
    - Unit costs are paid only after the rules pass.

    Action cannot coexist with Production or Clock. Enabling it removes both from this draft.

    Clicking an item inside Inventory releases it to Board or Toolbar; it does not run the item's Action.
Item artwork help:
  value: |
    Artwork combines a base image with an optional overlay.

    **Base tile scale** sizes both images together. `1` uses the whole image canvas; transparent PNG padding still counts. Scale changes appearance only, never occupied cells.

    The preview updates immediately and matches Item detail.
Item clock empty title:
  value: Automate production or give this item a limited lifetime.
Item clock help:
  value: |
    Clock adds repeating production, a limited Lifetime, or both.

    - **Interval** tries the line marked Clock. Leave empty for no repeating production.
    - **Lifetime** expires the item. Leave empty for no time limit.
    - **Wait for output** lets started jobs finish before removal.
    - **Stop immediately** cancels unfinished work at expiry; anything that cannot fit is lost.
    - Every Enable rule must pass; any matching Disable rule pauses the Clock.

    Time advances only while the item is on a Board. Enabling Clock removes Action and sets maximum stack size to one.
Item connections help:
  value: |
    Connections answers four quick questions:

    - **Required by:** which items need this one?
    - **Inputs:** what does this item need?
    - **Produces:** what can this item create?
    - **Produced by:** what can create this item?

    Rows show the exact production line, action, merge, depletion or Clock behind the link. Search filters the current list; opening a result keeps the selected relationship.
Item delete help:
  value: |
    Delete first shows every saved place that still uses this item.

    Remove those links normally, or use **Force delete** to remove the listed starting items, requirements and outputs too. The confirmation shows the exact damage before anything happens.

    Artwork files and Notes stay; only this item's note links are removed.
Item detail is unavailable.:
  value: Item detail is unavailable.
Item details:
  value: Item details
Item draft status help:
  value: |
    **Draft** marks work in progress for you and other authors.

    The item still validates, runs in the game and appears in builds.
Item estimate help:
  value: |
    Estimate answers: **roughly what does the game need to obtain this item?**

    ### Reading it

    - **Quantity** is the approximate amount needed along one complete route.
    - **Time** is that step's contribution to the optimistic total.
    - Random rewards use their average number of attempts.
    - Work that can happen together is counted in parallel.

    This is a planning shortcut, not a playthrough. Full queues, placement, player choices and unlucky rolls can make real play slower. **Incomplete** means the calculation hit a limit; **Unreachable** means no complete route starts from the project's starting items.
Item global count help:
  value: |
    Maximum total quantity of this item across the whole game.

    Stacks count every item. Leave empty for no limit.
Item identity help:
  value: |
    The Item page is the overview: artwork, storage, Production, Merges, Units, Clock and Action in one place.

    - **Allowed storage** chooses Board, Toolbar, Inventory or any of them.
    - **Maximum stack size** limits how many items share one cell.
    - **Maximum global count** limits the item across the whole game.
    - **Show all** opens the full detail page for a section; **Edit** opens its form.

    Action cannot coexist with Production or Clock. Merges work independently.

    Renaming **Item ID** updates project links; UID never changes. **Draft** is saved immediately and marks work in progress, but the item still runs and builds normally.
Item list help:
  value: |
    Browse saved items by title or ID. Cards show artwork, Estimate, Demand, Draft status and linked Notes.

    ### Filters and sorting

    - Sort by **Name**, estimated time or highest Demand.
    - **Unreachable** includes incomplete routes.
    - **With note** and **Draft** combine with search and sorting.

    **Estimate** is the optimistic time to obtain one item. **Demand** approximates how much of it is needed across reachable item routes. Both are planning hints, not balance verdicts.

    **New item** opens an unsaved draft. Creating from Artwork fills its first title and artwork for you.
Item merges empty title:
  value: Define what happens when this item is dropped onto another.
Item merges help:
  value: |
    A merge starts when you drop this item onto the selected **Merge with** item.

    - **Dragged item** decides what happens to the item you moved.
    - **Target item** decides what happens to the item receiving it.
    - **Merge output** may create extra items afterward.

    Direction matters: A onto B is not B onto A. Changes start working after **Save**.
