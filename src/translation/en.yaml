Item action empty title:
  value: Let a click open Inventory or move to another space.
Item action help:
  value: |
    Action is the item's immediate click handler. Choose **Space** to enter a target board space or **Inventory** to open Inventory.

    All input costs and rules must pass before activation. Every Enable rule must pass; any matching Disable rule prevents the action. Switching action kind keeps shared inputs and rules.

    Enabling Action removes production lines and Clock from the draft. **Save** applies the change; **Discard** keeps the saved configuration.

    Inside Inventory, clicking always releases the item to the first free compatible Board or Toolbar cell. It never runs that item's action. This also lets an inventory-opening item be stored and released normally.
Item artwork help:
  value: |
    Artwork combines a base asset with an optional overlay, drawn back to front.

    **Base tile scale** changes the artwork size within its tile. A value of 1 fills the tile with the artwork canvas; transparent PNG padding remains visible. Scale does not change occupied cells, storage, interaction reach, or image resolution.

    The preview below the form updates as you change the base asset, overlay, or scale. Its frame marks the complete tile. The same composition is shown in Item detail.
Item clock empty title:
  value: Automate production or give this item a limited lifetime.
Item clock help:
  value: |
    A Clock adds periodic production, a finite lifetime, or both.

    - **Interval** attempts the line marked Clock periodically. Leave it empty for a one-shot lifetime without pulses.
    - **Lifetime** sets how long the timer may run. Leave it empty for an unlimited lifetime.
    - At least one timer is required. **Expiry output** and **Expiry mode** are available only with a lifetime.
    - **Loose-kill** is the default: accepted production settles before the item disappears. A job whose output cannot fit keeps its owner alive.
    - **Kill switch** cancels queued and active work, then removes the owner in one atomic change. Reserved items have placement priority, followed by unused buffered materials and the normal Clock expiry output. Anything that cannot fit is lost and recorded in gameplay logs. Consumed job inputs and spent units are not refunded; canceled jobs emit no line output. Incoming deliveries return normally.

    Both modes resolve the configured expiry output. A job that already completed at the same Tick boundary keeps its result.

    **Enabled** and availability rules determine whether the timer runs. Every Enable rule must pass; any matching Disable rule pauses it. Accepted production keeps its own line rules.

    Enabling Clock removes the item's action and requires a stack size of one. Clock can use any storage scope, but its interval and lifetime advance only while its exact identity is on a Board. Moving it elsewhere pauses the saved timer state until it returns. New clocks start with a five-minute lifetime and no periodic interval.
Item connections help:
  value: |
    Connections explores one explicit authored relationship for any item.

    - **Required by** lists authored owners that directly input this item or positively require it in a production condition.
    - **Inputs** shows those same direct inputs and positive conditions from the selected owner's side.
    - **Produces** lists the direct outputs of authored operations owned by the selected item.
    - **Produced by** lists owners that emit this item through production lines, Clock expiry, unit depletion, or merges. These are authored possibilities, regardless of current availability.

    Each connection shows its authored source instead of an item ID: the production line, action, merge, unit depletion, or Clock, including output set and roll when applicable. Multiple sources share one item row.

    Use the search to find an item in the active relationship list. Open any result to inspect that item without losing the selected relationship.
Item delete help:
  value: |
    Delete checks the saved project for references to this item. Follow a blocker to inspect its owner before deleting.

    Ordinary deletion requires those references to be removed. **Force delete** also removes the listed starting entries, operations and outputs that depend on this item; review the concrete impact in the confirmation dialog.

    Asset files remain in the project. Linked Notes remain, with this item's link removed. Deletion is applied only after confirmation.
Item depletion output empty title:
  value: Create items when the last unit is spent.
Item estimate help:
  value: |
    Estimate answers a practical question: **what would the game roughly need to obtain this item?** It follows starting items and production rules until it finds one complete route.

    This is a planning preview, not a simulation or a promise.

    ### Reading the result

    - Each row is an item needed somewhere along the selected route.
    - **Quantity** is the approximate amount the route consumes or requires.
    - **Time** is how much that part contributes to the optimistic total.
    - The Time and Quantity buttons only reorder the same result.

    Arkini uses authored runtimes, output quantities and chances. Random outputs are converted into an expected number of attempts. Independent work can happen in parallel, so its time is not blindly added together.

    Real play may take longer or choose another route because player decisions, placement, timing and actual random rolls are not simulated. Clock Kill switch can cancel unfinished production and discard outputs that cannot fit; Estimate does not simulate these losses. **Partial** or **unreachable** means the authored data did not provide one complete calculable path.
Item global count help:
  value: |
    Limits the total quantity of this item across the game. Stack quantities contribute to the same global limit. Leave empty for no global limit.
Item identity help:
  value: |
    Item brings together identity, artwork, storage limits, units, actions, merges, Clock and a production summary. Use each section's **Edit** action to open its exact settings.

    **Storage scope** controls placement on Board, Toolbar and Inventory. **Stack capacity** counts separate items in one stack; **Units** are the supply inside each item. **Game limit** limits the item across the game.

    **Action** opens a Space or Inventory after its inputs and rules pass. **Merges** apply a source action, target effect and optional output when this item is dropped onto a matching target. Action cannot coexist with production lines or Clock; Merges are independent.

    **Production** previews the first two lines and their outputs. Open a line to edit it, or use **Show all** for the complete Production page.

    **Clock** has its own section for periodic production, a finite lifetime and expiry output. A lifetime works without production lines.

    The Item tab keeps the overview. **Show all** opens the corresponding detail tab: Artwork, Production, Merges, Units, Clock or Action. These tabs match the editing sections; **Edit** opens that section, and **Save** or **Discard** returns to its detail. Estimate, Chain, Connections, Notes and Delete remain available alongside them.

    Item IDs can be renamed with their project references. The UID remains the item's stable identity. Artwork changes appearance without changing occupied cells.

    **Draft** is saved immediately as an Editor organization flag. Draft items still participate in the game and the built Arkpack. Other edits are applied with **Save**; **Discard** leaves the saved item unchanged.
Item list help:
  value: |
    Browse the project's saved items by title or ID. Each card shows its artwork, title, acquisition estimate and demand. Draft cards have a subtle tint; a note icon marks linked item notes. Open a card for the item detail; its **Estimate** tab explains the selected route.

    Use **Name**, **Fastest first**, **Slowest first** or **Highest demand first** to order the grid. **Unreachable** shows partial estimates and unreachable items. **With note** shows items with linked notes. **Draft** combines with search and the selected view; drafts still participate in the game and Arkpack builds.

    **Estimate** is the optimistic time to obtain one item. Independent work can happen in parallel, and random outputs are averaged across the expected number of attempts. **Demand** adds up how much of this item is needed to obtain one of every reachable item through the selected routes. Its percentage compares with the highest-demand item in the project.

    **Partial** means analysis hit a safety limit. **Unreachable** means there is no complete authored route from the starting items. Unavailable results appear as a dash. This is a planning preview, not a playthrough or a balance verdict.

    **New item** opens an unsaved draft. Creating an item from an asset supplies its initial artwork and title. Save applies changes to the project.
Item merges empty title:
  value: Define what happens when this item is dropped onto another.
Item merges help:
  value: |
    Merges trigger when this item is dropped onto a matching target.

    The **Source action** decides whether the dropped item is consumed, retained, or spends a unit. The **Target effect** decides what happens to the target. A merge may also emit an extra output.

    Enable merges to add the first interaction, then select a target and configure both sides. Changes take effect when you save.
Item notes empty description:
  value: Create a note here to keep ideas and decisions linked to this item.
Item notes empty title:
  value: No notes for this item yet
Item player controls help:
  value: |
    **Interactive** allows players to start production, store or withdraw input materials, change the queue, and select the **Default** and **Clock** lines.

    **Automatic only** disables those production controls and leaves authored automation in charge. It does not change movement, merge or removal rules.
Item production empty title:
  value: Let this item produce other items.
Item production help:
  value: |
    Production shows the authored production lines. Queue capacity and player controls are shown on the Item page. Clock settings have their own Clock tab and remain visible in the Item overview. Each line has its own runtime, visibility, availability rules, inputs and optional output.

    **Default** selects the manual click line. **Clock** independently selects the line attempted at every timer pulse. Selecting either role clears only that role on the other lines. Without a Clock line, the timer continues without adding work.

    Manual and automatic requests use the same queue in admission order. Queue capacity includes the active job. A blocked or full queue skips a Clock pulse without storing missed work.

    **Interactive** allows manual production, material management, queue changes and line selection. **Automatic only** removes those player controls.

    Clock can also give an item a finite lifetime without any lines. **Loose-kill** lets accepted production settle before expiry; **Kill switch** cancels unfinished work at expiry and may lose materials or expiry outputs that cannot be placed. Adding a production line removes the configured Action when the draft is saved.
Item section copy help:
  value: |
    In the edit form, **Copy from** selects another saved item in this project. Confirm to replace the **entire active section**, including its unsaved changes. Collections are replaced in full, never merged; an absent optional section removes it from the destination. The source item stays unchanged.

    **Save** persists the replacement together with the rest of your draft. **Discard** restores the saved destination item. Item references retain their authored targets; self-paid unit inputs bind to the destination when saved.

    - **Item:** copies title, description, player controls, storage, stack and global limits. Item ID, UID and draft status stay unchanged. An existing Clock keeps a stack size of one.
    - **Artwork:** replaces base artwork, overlay and scale.
    - **Production:** replaces all lines and queue capacity. Nonempty production removes the destination action.
    - **Merges:** replaces all merge rules and their outputs.
    - **Units:** replaces amount and depletion output.
    - **Clock:** replaces timing, enabled state, rules and expiry output. A copied Clock removes the destination action and sets a stack size of one.
    - **Action:** replaces the complete action, inputs and rules. A copied action removes destination production lines and Clock.
Item stack size help:
  value: |
    The maximum quantity that can share one cell as a stack. This is separate from **Units**, the finite supply inside one item. A configured **Clock** requires a stack size of one.
