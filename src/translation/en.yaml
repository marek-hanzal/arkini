Product lines help:
  value: |
    Product lines define the jobs this item can perform.

    Each line owns its runtime, inputs, rules, and output. Adding the first line enables production and removes an incompatible item action. Removing every line disables production.
Production:
  value: Production
Production disable rule help:
  value: |
    A **Disable** rule makes this line unavailable while every condition matches.

    Disable wins over the authored Enabled state and passing Enable rules. Visibility is evaluated separately.
Production enable rule help:
  value: |
    An **Enable** rule is a positive availability gate for this line.

    When Enable rules exist, every one must pass. A matching Disable rule still wins.
Production hide rule help:
  value: |
    A **Hide** rule conceals this line while every condition matches.

    Hide wins over the authored Visible state and matching Show rules. It does not directly cancel already accepted work.
Production input type help:
  value: |
    Select the contract this production line must satisfy before a job starts.

    - **Simple:** explicitly requires no item.
    - **Materials:** consumes or reserves delivered items.
    - **Units:** spends finite units from the owner or a matching Board item.
Production inputs help:
  value: |
    Inputs belong only to this production line. **Every configured input must be ready** before a job may start.

    At least one explicit contract is required. A **Simple** input documents that the line intentionally needs no material; Materials and Units add real costs.
Production line:
  value: Production line
Production line Clock help:
  value: |
    Marks this line as the target for automatic Clock pulses.

    At most one sibling line may be Clock-selected. This selection is independent of **Default** and does not reset the Clock's phase or lifetime.
Production line check ahead help:
  value: |
    Before this item is produced, checks whether one future run could fit under item-count limits.

    Only checked lines that are visible and enabled by default participate, and one fitting alternative is enough. This is a one-step admission check; it reserves no future output.
Production line default help:
  value: |
    Marks this line as the initial choice for manual production.

    At most one sibling line may be Default-selected. Changing it does not alter the line selected for **Clock** pulses.
Production line enabled help:
  value: |
    Sets the line's authored base availability.

    An enabled line may accept jobs after its runtime Enable and Disable rules are evaluated. This does not control whether the line is visible.
Production line rules help:
  value: |
    These rules belong only to the selected production line and are evaluated from the current game state.

    - **Show/Hide** control presentation; Hide wins.
    - **Enable/Disable** control admission; every Enable must pass and Disable wins.
    - Runtime rules change job duration; multipliers apply before signed adjustments.

    Sibling lines and already accepted requests keep their own contracts.
Production line runtime help:
  value: |
    Base duration of one job before runtime rules.

    Active multipliers apply first, then signed adjustments. A resulting duration of zero completes at the next normal settlement boundary.
Production line visibility help:
  value: |
    Sets whether players see this line before runtime Show and Hide rules are applied.

    Visibility does not itself make the line available for production.
Production output help:
  value: |
    Output resolves after a completed production job.

    - **Output sets** are alternatives. Their relative weights decide which one is selected; equal weights make them equally likely.
    - Every **roll** in the selected set runs. Guaranteed rolls always resolve, chance rolls test their probability, and weighted rolls select the configured number of candidates.
    - Each selected **drop** applies its own quantity, placement, and rules before emitting items.
Production queue capacity help:
  value: |
    Maximum accepted work across all lines owned by this item identity.

    Capacity counts **one active job plus queued requests**. New requests are rejected when the shared queue is full; it is not a separate limit per line.
Production runtime adjustment rule help:
  value: |
    Adds a signed duration while every condition matches.

    All active runtime multipliers apply first; adjustments are applied afterward. Negative results clamp to immediate completion semantics.
Production runtime multiplier rule help:
  value: |
    Multiplies the line's base runtime while every condition matches.

    Multiple active multipliers combine before any signed runtime adjustments.
Production show rule help:
  value: |
    A **Show** rule makes this line visible while every condition matches.

    A matching Hide rule still wins. Availability is evaluated separately.
