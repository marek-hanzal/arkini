Output set weight help:
  value: |
    ### How output-set selection works

    Exactly **one output set** is selected whenever this output resolves. Its weight is compared with the weights of all sibling sets.

    Weights are ratios, not percentages. For example:

    - set A with weight **3** has a **75%** chance;
    - set B with weight **1** has a **25%** chance.

    After a set wins, the engine resolves every roll configured inside that set.
