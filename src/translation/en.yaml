Rolls:
  value: Rolls
Rolls help:
  value: |
    ### How rolls work

    After one **output set** is selected, the engine evaluates every roll inside it in authored order. Rolls are additive: their accepted drops are combined into one output. A roll that produces nothing does not stop its sibling rolls.

    Each accepted drop then evaluates its own **rules**, chooses a quantity within its **Minimum–Maximum** range, and uses its configured **Board placement**.

    ### Roll types

    - **Guaranteed** always offers every configured drop once. Example: a Guaranteed roll with **2 Wood** and **1 Stone** always adds both drops.
    - **Chance** performs one probability check for the complete roll. At **25%**, either all configured drops continue to resolution or none do. Multiple drops do not receive separate 25% checks.
    - **Weighted** performs the number of independent picks configured under **Selections**. Each pick chooses one candidate by relative weight, then offers every drop in that candidate. Candidates stay available, so the same candidate may win more than once.

    ### Weighted example

    A Weighted roll has **2–2 Selections** and two candidates:

    - **3 Iron**, weight **3**;
    - **1 Coal**, weight **1**.

    Every pick has a **75%** chance to choose Iron and a **25%** chance to choose Coal. Because the two picks are independent, the result can be **6 Iron**, **3 Iron + 1 Coal**, or **2 Coal**.

    ### Combined example

    One set containing **Guaranteed 2 Wood**, **Chance 50%: 1 Gem**, and the Weighted roll above always attempts 2 Wood, may also attempt 1 Gem, and then adds exactly two weighted candidate results.
