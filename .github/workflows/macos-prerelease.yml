name: Development Prerelease

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-dev.*"

concurrency:
  group: macos-prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-macos:
    name: Build release-channel macOS arm64 artifacts
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      ARKINI_RELEASE_ISSUER: https://token.actions.githubusercontent.com
      ARKINI_RELEASE_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/macos-prerelease.yml
      ARKINI_RELEASE_SIGN: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install dependencies
        run: ./Argcfile.sh install

      - name: Use tag version for release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: ./Argcfile.sh version "${GITHUB_REF_NAME#v}"

      - name: Package macOS arm64 application
        run: ./Argcfile.sh package-macos

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: arkini-macos-arm64-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            .out/desktop/release/*.dmg
            .out/desktop/release/*.zip
            .out/desktop/release/*.arkpack
            .out/desktop/release/*.arksig
            .out/desktop/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  package-windows:
    name: Build release-channel Windows x64 artifacts
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install dependencies
        run: ./Argcfile.sh install

      - name: Use tag version for release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: ./Argcfile.sh version "${GITHUB_REF_NAME#v}"

      - name: Package Windows x64 application
        run: ./Argcfile.sh package-windows

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: arkini-windows-x64-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            .out/desktop/release/*.exe
            .out/desktop/release/*.zip
            .out/desktop/release/*.arkpack
            .out/desktop/release/SHA256SUMS-windows-x64
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish complete development prerelease
    needs:
      - package-macos
      - package-windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: arkini-macos-arm64-${{ github.run_number }}-${{ github.run_attempt }}
          path: release/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: arkini-windows-x64-${{ github.run_number }}-${{ github.run_attempt }}
          path: release/windows

      - name: Publish GitHub prerelease
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/macos/*.dmg \
            release/macos/*.zip \
            release/macos/arkini.arkpack \
            release/macos/arkini.arksig \
            release/macos/SHA256SUMS \
            release/windows/*.exe \
            release/windows/*.zip \
            release/windows/SHA256SUMS-windows-x64 \
            --verify-tag \
            --prerelease \
            --title "Arkini $GITHUB_REF_NAME" \
            --notes "Unsigned macOS Apple Silicon and Windows x64 builds plus the standalone official Arkpack and Sigstore bundle. Verify the platform checksum file before opening; macOS requires the normal Gatekeeper override."
