Item identity help:
  value: |
    The Item page is the overview: artwork, Production, Merges, Units, Clock and Action in one place.

    - Each cell holds one item.
    - **Show all** opens the full detail page for a section; **Edit** opens its form.

    Action cannot coexist with Production or Clock. Merges work independently.

