name: Release Artifacts
run-name: Release ${{ inputs.release_tag || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag to build
        required: true
        type: string
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  SERAKKI_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  SERAKKI_RELEASE_ISSUER: https://token.actions.githubusercontent.com
  SERAKKI_RELEASE_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml

jobs:
  prerelease_checks:
    if: ${{ contains(inputs.release_tag || github.ref_name, '-') }}
    name: Prerelease ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: repository gate (Linux)
            os: ubuntu-24.04
            command: check
          - name: platform boundary gate (macOS)
            os: macos-15
            command: platform-check
          - name: platform boundary gate (Windows)
            os: windows-2025
            command: platform-check
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.SERAKKI_RELEASE_TAG }}
      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: ./Argcfile.sh install
      - name: Use tag version for release checks
        run: ./Argcfile.sh version "${SERAKKI_RELEASE_TAG#v}"
      - name: Prepare Community Serapack cache
        uses: ./.github/actions/serapack-cache
      - name: Run repository gate
        run: ./Argcfile.sh "${{ matrix.command }}"

  prepare_serapack:
    needs: prerelease_checks
    if: ${{ !cancelled() && (needs.prerelease_checks.result == 'success' || needs.prerelease_checks.result == 'skipped') }}
    name: Build and sign the canonical Serapack once
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.SERAKKI_RELEASE_TAG }}
          fetch-depth: 0
      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Install dependencies
        run: ./Argcfile.sh install
      - name: Use tag version for release artifacts
        run: ./Argcfile.sh version "${SERAKKI_RELEASE_TAG#v}"
      - name: Build, sign, and verify canonical Serapack
        env:
          SERAKKI_EXPECTED_PROVENANCE: official
          SERAKKI_RELEASE_SIGN: "1"
        run: ./Argcfile.sh build
      - name: Upload canonical Serapack
        uses: actions/upload-artifact@v6
        with:
          name: serakki-canonical-${{ env.SERAKKI_RELEASE_TAG }}
          path: game/serakki/build/serakki.serapack
          if-no-files-found: error
          retention-days: ${{ contains(inputs.release_tag || github.ref_name, '-') && 14 || 30 }}

  package:
    name: Package ${{ matrix.name }}
    needs: prepare_serapack
    if: ${{ !cancelled() && needs.prepare_serapack.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            command: package-macos
            artifact: serakki-macos-arm64
            paths: |
              .out/desktop/release/*.dmg
              .out/desktop/release/*.zip
              .out/desktop/release/*.serapack
          - name: Windows x64
            os: windows-2025
            command: package-windows
            artifact: serakki-windows-x64
            paths: |
              .out/desktop/release/*.exe
              .out/desktop/release/*.zip
          - name: Linux x64
            os: ubuntu-24.04
            command: package-linux
            artifact: serakki-linux-x64
            paths: |
              .out/desktop/release/*.AppImage
          - name: Linux arm64
            os: ubuntu-24.04-arm
            command: package-linux-arm64
            artifact: serakki-linux-arm64
            paths: |
              .out/desktop/release/*.AppImage
    defaults:
      run:
        shell: bash
    env:
      SERAKKI_EXPECTED_PROVENANCE: official
      SERAKKI_PREBUILT_SERAPACK: ${{ github.workspace }}/.release/serakki.serapack
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.SERAKKI_RELEASE_TAG }}
      - name: Install repository toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Install dependencies
        run: ./Argcfile.sh install
      - name: Use tag version for release artifacts
        run: ./Argcfile.sh version "${SERAKKI_RELEASE_TAG#v}"
      - name: Download canonical Serapack
        uses: actions/download-artifact@v8
        with:
          name: serakki-canonical-${{ env.SERAKKI_RELEASE_TAG }}
          path: .release
      - name: Package release artifacts
        run: ./Argcfile.sh "${{ matrix.command }}"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}-${{ env.SERAKKI_RELEASE_TAG }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: ${{ contains(inputs.release_tag || github.ref_name, '-') && 14 || 30 }}

  publish_release:
    needs: package
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    name: Publish complete release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: serakki-macos-arm64-${{ env.SERAKKI_RELEASE_TAG }}
          path: release/macos
      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: serakki-windows-x64-${{ env.SERAKKI_RELEASE_TAG }}
          path: release/windows
      - name: Download Linux x64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: serakki-linux-x64-${{ env.SERAKKI_RELEASE_TAG }}
          path: release/linux-x64
      - name: Download Linux arm64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: serakki-linux-arm64-${{ env.SERAKKI_RELEASE_TAG }}
          path: release/linux-arm64
      - name: Publish GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$SERAKKI_RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$SERAKKI_RELEASE_TAG" \
            release/macos/*.dmg \
            release/macos/*.zip \
            release/macos/serakki.serapack \
            release/windows/*.exe \
            release/windows/*.zip \
            release/linux-x64/*.AppImage \
            release/linux-arm64/*.AppImage \
            --verify-tag \
            "${release_flags[@]}" \
            --title "Serakki $SERAKKI_RELEASE_TAG" \
            --notes "Unsigned macOS Apple Silicon, Windows x64, and Linux x64/arm64 applications with one embedded official Serapack, plus the same standalone Serapack. GitHub exposes the SHA-256 digest of every asset; macOS requires the normal Gatekeeper override."
