Notes help:
  value: |
    Keep project ideas, reminders and design decisions in **Markdown**.

    Notes are stored once and can link to several items or assets. An Item or Asset **Notes** page shows the notes linked to that entry; the global **Notes** page shows the whole collection. A note created from an Item or Asset starts linked to it.

    Removing a link keeps the note and its other links. Deleting a note removes it from the whole project. Renaming an asset preserves its note links; deleting an item or asset removes only that entry's links.

    Notes travel with the portable Editor project, but are excluded from **Build** and **Arkpack** output. Use Git to version the project and its notes.
